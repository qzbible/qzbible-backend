name: Build and deploy

on:
  workflow_dispatch:
  push:
    branches:
      - develop 
      - main
     
    
jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions: # Give more permissions to the GITHUB_TOKEN
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      API_IMAGE_NAME: ${{ github.repository }}-api
    outputs:
      api-image-tags: ${{ steps.meta-api.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta for the api
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          flavor: |
            latest=false

      - name: Login to github packages registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          file: docker/develop/flask/Dockerfile
          context: .
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

  dev:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
    needs:
      - build-images
    concurrency:
      group: dev
      cancel-in-progress: false

    environment:
      name: dev
      url: https://dev-backend.qzbible.com/ 

    env:
      IMAGE_TAG: ${{needs.build-images.outputs.api-image-tags}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ansible
        uses: qzbible/config-server/.github/actions/setup-ansible@v1.0.0
        with:
          ssh_private_key: ${{ secrets.OVH_MANAGER_SSH_PRIVATE_KEY }}
          ansible_vault_pass: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          working_directory: deploy

      - name: Display the image being deployed
        run: echo "Deploying the image ${IMAGE_TAG}"

      - name: Running ansible
        working-directory: deploy
        run: |
          ansible-playbook -e env=dev -e qzbible_backend_image=${IMAGE_TAG} deploy.yml

    
            
  prod:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs:
      - build-images
    concurrency:
      group: prod
      cancel-in-progress: false
    environment:
      name: prod
      url: https://backend.klivar.com/__healthcheck/
    env:
      IMAGE_TAG: ${{needs.build-images.outputs.api-image-tags}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ansible
        uses: klivar-gdpr/config-server/.github/actions/setup-ansible@v1.0.0
        with:
          ssh_private_key: ${{ secrets.OVH_MANAGER_SSH_PRIVATE_KEY }}
          ansible_vault_pass: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          working_directory: deploy

      - name: Display the image being deployed
        run: echo "Deploying the image ${IMAGE_TAG}"

      - name: Running ansible
        working-directory: deploy
        run: |
          ansible-playbook -e env=prod -e klivar_backend_image=${IMAGE_TAG} deploy.yml


          
